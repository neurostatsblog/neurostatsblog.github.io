title: neurostatsblog
tagline: Notes on neuroscience, machine learning theory, and statistical inference
description: >-
  A research blog covering Gaussian processes, Bayesian inference, neural population coding,
  dynamical systems, and the mathematics of learning — by a computational neuroscientist at NYU.
url: "https://neurostatsblog.github.io"
baseurl: ""

# Buttondown handle drives the /subscribe page form action.
# Leave empty to render the page with only the RSS option (graceful fallback).
buttondown_username: "neurostatsblog"

author:
  name: Alex Williams
  email: alex.h.williams@nyu.edu
  bio: >-
    Faculty at NYU working at the intersection of computational neuroscience,
    machine learning, and statistical inference.
  links:
    - label: GitHub
      url: https://github.com/neurostatsblog

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

# Enable math rendering
mathjax: true

# Plugins (site is built by GitHub Actions, so we're not limited to the
# GitHub Pages plugin allowlist).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

# Generate one page per tag at /tags/<slug>/
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: tag-archive
  permalinks:
    tag: /tags/:name/

# The github-pages gem enforces safe mode by default, which disables custom
# files in _plugins/. We disable safe mode locally so the math-block hook
# loads. (GitHub Pages production enforces safe mode at the server level
# regardless of this setting, so this flag is a no-op there.)
safe: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .git
  - .gitignore
  - Dockerfile
  - docker-compose.yml
  - vendor
  - notes
  - code
  - bin
  - pdf
  - .github
  - .bundle

# Collections and defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Alex Williams

# Pagination (optional — requires jekyll-paginate plugin)
# paginate: 10
# paginate_path: "/page:num/"
