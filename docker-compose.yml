services:
  site:
    build: .
    image: neurostatsblog-jekyll
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle

  pdf:
    image: pandoc/extra:3.1
    platform: linux/amd64
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /data
    volumes:
      - .:/data

  betting:
    build:
      context: ./code/betting
      dockerfile: Dockerfile
    image: neurostatsblog-betting
    working_dir: /data/code/betting
    volumes:
      # Mount the whole repo so the script can write PNGs into
      # assets/img/posts/... alongside writing PDFs into code/betting/figures/.
      - .:/data
      - nemos-cache:/root/.cache

volumes:
  bundle:
  nemos-cache:
