---
layout: default
---
<section class="search-page" data-pagefind-ignore>
  <div class="container-narrow">

    <header class="search-header">
      <h1 class="search-title">Search</h1>
      <form id="search-form" class="search-form" role="search"
            action="{{ '/search/' | relative_url }}" method="get"
            data-pagefind-url="{{ '/pagefind/pagefind.js' | relative_url }}">
        <label for="search-input" class="sr-only">Search posts</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          name="q"
          placeholder="Search posts…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-describedby="search-status">
      </form>
    </header>

    <p id="search-status" class="search-status" aria-live="polite"></p>

    <ol id="search-results" class="search-results post-list" role="list"></ol>

    <noscript>
      <p class="search-status">Search requires JavaScript.</p>
    </noscript>

  </div>
</section>

<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
